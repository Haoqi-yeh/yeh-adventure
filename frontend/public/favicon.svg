<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Sky blue background -->
  <rect width="32" height="32" fill="#5BC8F5"/>

  <!-- Dark outline -->
  <!-- row 1: cols 4-6 -->
  <rect x="8"  y="2"  width="6"  height="2" fill="#1B2A5A"/>
  <!-- row 2: col 3 | cols 7-8 -->
  <rect x="6"  y="4"  width="2"  height="2" fill="#1B2A5A"/>
  <rect x="14" y="4"  width="4"  height="2" fill="#1B2A5A"/>
  <!-- row 3: col 2 | cols 9-10 -->
  <rect x="4"  y="6"  width="2"  height="2" fill="#1B2A5A"/>
  <rect x="18" y="6"  width="4"  height="2" fill="#1B2A5A"/>
  <!-- row 4: col 1 | col 11 -->
  <rect x="2"  y="8"  width="2"  height="2" fill="#1B2A5A"/>
  <rect x="22" y="8"  width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 5: col 1 | col 11 -->
  <rect x="2"  y="10" width="2"  height="2" fill="#1B2A5A"/>
  <rect x="22" y="10" width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 6: col 0 | col 12 -->
  <rect x="0"  y="12" width="2"  height="2" fill="#1B2A5A"/>
  <rect x="24" y="12" width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 7: col 0 | col 12 -->
  <rect x="0"  y="14" width="2"  height="2" fill="#1B2A5A"/>
  <rect x="24" y="14" width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 8: col 0 | col 12 -->
  <rect x="0"  y="16" width="2"  height="2" fill="#1B2A5A"/>
  <rect x="24" y="16" width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 9: col 0 | col 12 -->
  <rect x="0"  y="18" width="2"  height="2" fill="#1B2A5A"/>
  <rect x="24" y="18" width="2"  height="2" fill="#1B2A5A"/>
  <!-- row 10: cols 1-11 (bottom edge) -->
  <rect x="2"  y="20" width="22" height="2" fill="#1B2A5A"/>

  <!-- White cloud body -->
  <!-- row 2: cols 4-6 (top bump) -->
  <rect x="8"  y="4"  width="6"  height="2" fill="#FFFFFF"/>
  <!-- row 3: cols 3-8 -->
  <rect x="6"  y="6"  width="12" height="2" fill="#FFFFFF"/>
  <!-- row 4: cols 2-10 -->
  <rect x="4"  y="8"  width="18" height="2" fill="#FFFFFF"/>
  <!-- row 5: cols 2-10 -->
  <rect x="4"  y="10" width="18" height="2" fill="#FFFFFF"/>
  <!-- row 6: cols 1-11 -->
  <rect x="2"  y="12" width="22" height="2" fill="#FFFFFF"/>
  <!-- row 7: cols 1-11 -->
  <rect x="2"  y="14" width="22" height="2" fill="#FFFFFF"/>
  <!-- row 8: white flanks (cols 1-2 and 10-11) -->
  <rect x="2"  y="16" width="4"  height="2" fill="#FFFFFF"/>
  <rect x="20" y="16" width="4"  height="2" fill="#FFFFFF"/>
  <!-- row 9: white flanks (col 1 and col 11) -->
  <rect x="2"  y="18" width="2"  height="2" fill="#FFFFFF"/>
  <rect x="22" y="18" width="2"  height="2" fill="#FFFFFF"/>

  <!-- Light blue-grey shadow (bottom of cloud) -->
  <!-- row 8: cols 3-9 -->
  <rect x="6"  y="16" width="14" height="2" fill="#B0CCE0"/>
  <!-- row 9: cols 2-10 -->
  <rect x="4"  y="18" width="18" height="2" fill="#B0CCE0"/>
</svg>
